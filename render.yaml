services:
  - type: web
    name: resume-analyzer-backend
    env: docker
    rootDir: backend
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        sync: false # User will provide this in Render dashboard
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true # Generates a secure random JWT secret automatically
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: resumes
