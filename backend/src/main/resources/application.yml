server:
  port: 8080

spring:
  profiles:
    active: dev
  config:
    import: optional:file:.env[.properties]

  application:
    name: resume-analyzer-backend

  datasource:
    url: ${DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/resume_analyzer?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}}
    username: ${DB_USERNAME:ai_resume}
    password: ${DB_PASSWORD:airesume}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 60000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-prod-min-256-bits-xyz1234567890}
    expiration-ms: 86400000   # 24 hours

  file-storage:
    upload-dir: ${UPLOAD_DIR:./uploads}

  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
    base-url: https://generativelanguage.googleapis.com/v1beta

logging:
  level:
    com.resumeanalyzer: INFO
